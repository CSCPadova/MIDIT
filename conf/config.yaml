defaults:
    - /hydra/callbacks:
        - log_job_return_callback
    - override /hydra/launcher: submitit_slurm
    - _self_

data:
    data_dir: data
    logs_dir: logs
    num_workers: 1
    max_midi_length: 1024
    max_text_length: 256
    midi_vocab_size: 512
    text_vocab_size: 10000

model:
    d_model: 512
    nhead: 8
    num_encoder_layers: 6
    num_decoder_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
    max_seq_length: 1024

diffusion:
    timesteps: 1000
    beta_schedule: linear

train:
    accelerator: gpu
    batch_size: 8
    epochs: 10
    fast_run: false

optim:
    lr: 0.0001

logging:
    use_wandb: true
    use_tensorboard: true
    wandb_project: midit
    wandb_entity: null
