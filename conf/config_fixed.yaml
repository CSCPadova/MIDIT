# Configuration for Phase 1 Training - EXPERIMENT 1
# Test: Sqrt Class Weights + Bar-Level Masking (Current)
# ONE VARIABLE AT A TIME!

experiment:
  name: "phase1_exp1_classweights"
  description: "Test sqrt class weights with bar-level masking"
  version: "1.0"
  tags: ["phase1", "class-weights", "sqrt-scaling", "experiment-1"]

# ============================================================================
# Paths
# ============================================================================
paths:
  data_dir: "data/preprocessed_phase1"
  checkpoint_dir: "logs/checkpoints_phase1_exp1"  # ← Separato!
  log_dir: "logs"
  class_weights_path: "class_weights.json"

# ============================================================================
# Model Architecture (SAME AS EPOCH 47)
# ============================================================================
model:
  vocab_size: 518
  d_model: 512
  nhead: 8
  num_layers: 12
  dim_feedforward: 2048
  dropout: 0.1
  
  vocab_sizes:
    pitch: 151
    velocity: 32
    duration: 32
    program: 129
    position: 96
    bar: 1
    tempo: 32
    timesig: 9
    rest: 32

# ============================================================================
# Lambda Weights (SAME AS EPOCH 47 - BEST)
# ============================================================================
lambda_weights:
  pitch: 1.0
  velocity: 0.5
  duration: 0.8
  program: 1.0
  position: 0.2
  bar: 0.1
  tempo: 2.0
  timesig: 2.0
  rest: 0.5

# ============================================================================
# Class Weights (EXPERIMENT 1 - ONLY CHANGE!)
# ============================================================================
class_weights:
  enabled: true
  scaling: "sqrt"  # ← KEY: sqrt(imbalance) instead of raw
  token_types: ["velocity", "program"]
  weights_file: "class_weights.json"
  max_weight: 150.0  # Safety cap (dopo sqrt dovrebbe essere ~89)

# ============================================================================
# Data & Masking (KEEP BAR-LEVEL - NO CHANGE!)
# ============================================================================
data:
  chunking:
    strategy: "bar_based"
    bars_per_chunk: 8
    tokens_per_chunk: 4096
    max_tokens: 8192
  
  masking:
    strategy: "bar_level"  # ← KEEP CURRENT (buggy ma noto)
    bar_mask_prob: 0.4
    type_mask_ratio: 0.8
    # Token-level params (not used yet)
    mask_ratio: 0.15
    mask_type: "bert"

# ============================================================================
# Training (SAME AS BEFORE)
# ============================================================================
training:
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  max_epochs: 50
  warmup_steps: 1000
  scheduler: "cosine"
  save_top_k: 3
  monitor: "val_loss"
  mode: "min"
  patience: 10
  min_delta: 0.001
  precision: "16-mixed"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

validation:
  batch_size: 32
  check_val_every_n_epoch: 1

logging:
  project: "midit"
  run_name: "phase1_exp1_classweights"
  log_every_n_steps: 50
  logger: "wandb"

hardware:
  accelerator: "gpu"
  devices: 1
  num_workers: 4
  
seed: 42