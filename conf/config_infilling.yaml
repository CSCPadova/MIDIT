defaults:
  - config
  - _self_

# ============================================================
# Infilling fine-tuning config — Phase 1b
# Base: conf/config.yaml (all other params inherited)
# Do NOT use for pre-training
# ============================================================

# Overrides from base config:
train:
  lr: 3e-5
  warmup_steps: 200
  epochs: 10
  limit_train_batches: 50000
  limit_val_batches: 500
  val_check_interval: 1.0
  checkpoint_path: /nfsd/tesi/zanettisim/MIDIT/logs/checkpoints_phase1/phase1-epoch=14-val_loss=2.7254.ckpt

masking:
  strategy: bar_fill
  max_infill_bars: 3
  mask_strategy: always
  mask_prob: 0.15

paths:
  checkpoints_infilling: logs/checkpoints_infilling/
