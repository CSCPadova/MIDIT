[project]
name = "midit"
version = "0.1.0"
description = "Bidirectional masked language modeling for symbolic MIDI infilling"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Simone Zanetti" },
    { name = "Matteo Spanio", email = "spanio@dei.unipd.it" },
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "lightning>=2.5.5",
    "requests>=2.32.3",
    "tensorboard>=2.20.0",
    "torchaudio>=2.7.0",
    "torchmetrics>=1.8.0",
    "torchvision>=0.22.0",
    "wandb>=0.21.0",
    "transformers>=4.30.0",
    "protobuf>=6.31.1",
    "sentencepiece>=0.2.1",
    "datasets>=4.3.0",
    "pretty-midi==0.2.10",
    "miditok>=3.0.6.post1",
    "kaggle>=1.8.0",
    "miditoolkit>=1.0.1",
    "symusic>=0.5.9",
    "matplotlib>=3.10.7",
    "numpy>=2.2.4",
    "tqdm>=4.67.1",
]

[dependency-groups]
# Evaluation metrics (scripts/evaluation, scripts/verification):
#   uv sync --group eval
eval = [
    "muspy==0.5.0",
    "scipy==1.17.1",
]
# Development tools; installed by default with `uv sync`.
dev = [
    "pytest>=8.3",
    "pre-commit>=4.0",
    # Newer virtualenv (via pre-commit) would force newer filelock/packaging
    # than the locked runtime versions.
    "virtualenv<20.36",
]

[tool.pytest.ini_options]
# Only the smoke tests; the scripts/**/test_*.py files are diagnostic scripts
# that need data or checkpoints and must not be collected.
testpaths = ["tests"]

[project.scripts]
infer = "midit.infer:main"

[tool.hatch.build.targets.wheel]
packages = ["midit"]

[tool.hatch.build.targets.sdist]
include = [
    "/midit/**",
    "/conf",
    "/README.md",
    "/pyproject.toml",
    "/LICENSE",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
